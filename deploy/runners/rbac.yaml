# backlog 的两个 self-hosted runner 的 ServiceAccount + RBAC，外加它们共用的 `preview-deployer` Role 定义。
#
# 当前 ns：`ai-test`（runner 跟预览资源同住，靠 pod 名/label 区分）。
#
# 本仓 own 这套 RBAC：
#   - ServiceAccount ai-design-runner   （Runner C —— 跑 backlog 的 .github/workflows/analyze-requirement.yml）
#   - ServiceAccount ai-develop-runner  （Runner D —— 跑 backlog 的 .github/workflows/implement.yml，对抗实现 + 预览）
#   - Role preview-deployer             （定义放在本仓；om-datacenter/deploy/runners/rbac.yaml 里的 ai-dev-runner / k8s-deployer
#                                         的 RoleBinding 也引用本 Role —— 别忘了同步修改，违反则 om-datacenter 那俩 runner
#                                         会丢权限）
#   - 2 个 RoleBinding                  （把本仓两个 SA 绑到 preview-deployer Role）
#
# Role 权限范围：deployments / services / configmaps / secrets / ingresses / jobs / pods (含 exec/log) / events 的 CRUD/读。
# 之所以这样配，是因为这些 runner 在 ai-test ns 起 per-PR 预览资源、跑 tester pod、exec 进 pod HMR git pull / 健康探测。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-design-runner
  namespace: ai-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-develop-runner
  namespace: ai-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: preview-deployer
  namespace: ai-test
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]   # deployer 给每个 PR 建 per-PR 克隆 token Secret（不进 pod env）
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]   # create：data-pod 模式 `kubectl run` 起一次性测试 pod
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create", "get"]                 # exec 进 pod（HMR git pull / 分层测试 / 健康探测）
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]         # 失败诊断
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-design-runner-preview-deployer
  namespace: ai-test
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: preview-deployer }
subjects:
- kind: ServiceAccount
  name: ai-design-runner
  namespace: ai-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-develop-runner-preview-deployer
  namespace: ai-test
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: preview-deployer }
subjects:
- kind: ServiceAccount
  name: ai-develop-runner
  namespace: ai-test
