name: Bug Report
description: 报告缺陷（Phase 1.2 缺陷驱动入口，在项目仓库使用）
title: "[缺陷] "
labels: ["bug"]
body:
  - type: input
    id: title-field
    attributes:
      label: 缺陷标题
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 缺陷描述
      description: 描述问题现象、复现步骤、影响范围
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本/环境
      placeholder: e.g., v1.2.0
