name: 测试设计与测试用例

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    if: github.event.pull_request.merged == true
    runs-on: [self-hosted, ai-dev-runner]
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Find Architecture Design files changed in merged PR
        id: arch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Skip files removed by the PR — re-generating stubs for deleted issue dirs would resurrect them.
          gh pr view "$PR_NUM" --json files -q '.files[] | select(.status != "removed") | .path' > pr-files.txt
          grep -E '^issue_docs/[^/]+/Architecture (Design|Desgin)/.+\.md$' pr-files.txt > arch-files.txt || true
          if [ ! -s arch-files.txt ]; then
            echo "No Architecture Design markdown changed; nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Architecture files detected:"
          cat arch-files.txt

      - name: Check 功能设计分解 TASK 清单 section
        if: steps.arch.outputs.found == 'true'
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            if [ ! -f "$f" ]; then
              echo "::warning file=$f::file missing on base branch (deleted in PR?)"
              continue
            fi
            # Tolerate whitespace between 中文 and TASK 清单 (canonical heading is "功能设计分解TASK清单" but allow spaces).
            if grep -Eq '功能设计分解[[:space:]]*TASK[[:space:]]*清单' "$f"; then
              line=$(grep -nE '功能设计分解[[:space:]]*TASK[[:space:]]*清单' "$f" | head -1 | cut -d: -f1)
              echo "::notice file=$f,line=${line}::Found '功能设计分解 TASK 清单' section"
            else
              echo "::warning file=$f::Missing '功能设计分解 TASK 清单' section in architecture doc"
            fi
          done < arch-files.txt

      - name: Fetch Test templates from spec repo
        if: steps.arch.outputs.found == 'true'
        env:
          STRATEGY_TEMPLATE_URL: https://raw.githubusercontent.com/agentic-develop-playground/agent-development-specification/main/spec/teams/templates/Test/%231%20Test%20Strategy.md
          SPEC_TEMPLATE_URL: https://raw.githubusercontent.com/agentic-develop-playground/agent-development-specification/main/spec/teams/templates/Test/%231%20Test%20Specification.md
        run: |
          set -euo pipefail
          mkdir -p /tmp/test-templates
          curl -fsSL "$STRATEGY_TEMPLATE_URL" -o /tmp/test-templates/test-strategy.md
          curl -fsSL "$SPEC_TEMPLATE_URL"     -o /tmp/test-templates/test-specification.md
          wc -c /tmp/test-templates/*.md

      - name: Setup opencode
        if: steps.arch.outputs.found == 'true'
        env:
          HOME: /home/runner
          OPENCODE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          set -euo pipefail
          if ! command -v opencode >/dev/null 2>&1; then
            npm install -g opencode-ai || curl -fsSL https://opencode.ai/install | bash
          fi
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.opencode/bin:$PATH"
          command -v opencode || { echo "::error::opencode install failed"; exit 1; }
          opencode --version || true
          mkdir -p "$HOME/.local/share/opencode" "$HOME/.config/opencode"
          printf '{"alibaba-cn":{"type":"api","key":"%s"}}\n' "$OPENCODE_API_KEY" > "$HOME/.local/share/opencode/auth.json"
          chmod 600 "$HOME/.local/share/opencode/auth.json"
          printf '{"$schema":"https://opencode.ai/config.json"}\n' > "$HOME/.config/opencode/opencode.json"

      - name: Generate test design docs via opencode
        if: steps.arch.outputs.found == 'true'
        id: gen
        env:
          HOME: /home/runner
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          OPENCODE_MODEL: alibaba-cn/glm-5
        run: |
          set -euo pipefail
          command -v opencode >/dev/null 2>&1 || { echo "::error::opencode missing from PATH after Setup step"; exit 1; }
          python3 - <<'PY'
          import os, pathlib, subprocess, sys

          PR_NUM = os.environ["PR_NUM"]
          PR_URL = os.environ["PR_URL"]
          PR_TITLE = os.environ["PR_TITLE"]

          arch_files = [
              l for l in pathlib.Path("arch-files.txt").read_text().splitlines() if l.strip()
          ]
          generated = pathlib.Path("generated-files.txt")
          generated.write_text("")

          for arch_path in arch_files:
              issue_id = arch_path.split("/")[1]
              test_dir = pathlib.Path(f"issue_docs/{issue_id}/Test")
              test_dir.mkdir(parents=True, exist_ok=True)
              report = test_dir / "test-design-report.md"
              cases = test_dir / "test-design-cases.md"

              prompt_lines = [
                  "你是测试设计 agent。本次任务必须一次性跑完，全流程无需任何人工确认。",
                  "",
                  "【输入文档】（请使用 Read 工具读取，再开始产出）",
                  f"1. 架构设计文档：{arch_path}",
                  "2. 测试策略模板：/tmp/test-templates/test-strategy.md",
                  "3. 测试用例规约模板：/tmp/test-templates/test-specification.md",
                  "",
                  "【输出文件】（必须使用 Write 工具完整写出，不要省略、不要缩写）",
                  "",
                  f"文件 1：{report}",
                  "- 以「测试策略模板」结构为骨架",
                  f"- H1 改为 `# #{issue_id} <需求名称> 测试策略设计说明书`，需求名称取自架构文档",
                  f"- 在 H1 之后插入引用块，记录来源架构文档路径 `{arch_path}` 与触发 PR `[#{PR_NUM}]({PR_URL}) — {PR_TITLE}`",
                  "- 第 1 节「基本信息」按架构文档实际信息填写",
                  "- 第 2 节「测试维度确认」依据架构内容判断需要勾选哪些维度，给出勾选理由",
                  "- 第 3 节按勾选的维度填写专项验证设计，未勾选的小节直接删除",
                  "- 与架构文档「功能设计分解 TASK 清单」逐条对齐，确保每个 TASK 在测试策略中有对应入口",
                  "",
                  f"文件 2：{cases}",
                  "- 以「测试用例规约模板」字段定义为约束",
                  f"- H1 改为 `# #{issue_id} <需求名称> 测试用例清单`",
                  "- 用 markdown 表格列出所有用例，列与模板字段一致：用例 ID / 对应 task(issueID) 链接 / 前置条件 / 操作步骤 / 预期结果 / 优先级 / 类型",
                  "- 用例 ID 采用 `<模块>.<能力>.<序号>` 格式",
                  "- 至少覆盖架构文档中每条 SR/AR 与每个 TASK，关键 case 优先级 P0",
                  "- 「操作步骤」要可执行、「预期结果」要可断言",
                  "",
                  "完成两个文件的写入后停止；不要询问、不要修改其他文件。",
              ]
              prompt = "\n".join(prompt_lines)

              print(f"::group::opencode prompt for #{issue_id}")
              print(prompt)
              print("::endgroup::", flush=True)

              cmd = [
                  "opencode", "run",
                  "--model", os.environ.get("OPENCODE_MODEL", "alibaba-cn/glm-5"),
                  prompt,
              ]
              r = subprocess.run(cmd, text=True)
              if r.returncode != 0:
                  print(f"::error::opencode exited {r.returncode} for #{issue_id}", file=sys.stderr)
                  sys.exit(r.returncode)

              missing = []
              for label, p in (("report", report), ("cases", cases)):
                  if not p.is_file() or p.stat().st_size == 0:
                      missing.append(f"{label}={p}")
              if missing:
                  print(
                      f"::error::expected files missing/empty for #{issue_id}: {', '.join(missing)}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              with generated.open("a") as f:
                  f.write(f"{report}\n{cases}\n")
              print(
                  f"::notice::Generated #{issue_id}: report={report.stat().st_size}B cases={cases.stat().st_size}B"
              )
          PY

          echo "count=$(wc -l < generated-files.txt)" >> "$GITHUB_OUTPUT"

      - name: Open draft PR with generated test docs
        if: steps.gen.outputs.count != '' && steps.gen.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          BRANCH="bot/test-docs-from-pr-${PR_NUM}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          while IFS= read -r p; do git add -- "$p"; done < generated-files.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "docs(test): generate stub test design docs from PR #${PR_NUM}"
          git push -u origin "$BRANCH"

          cat > pr-body.md <<EOF
          Auto-generated draft from merged PR [#${PR_NUM}](${PR_URL}) — ${PR_TITLE}.

          Source architecture file(s):

          \`\`\`
          $(cat arch-files.txt)
          \`\`\`

          Stub content — replace with AI Agent output once wired up.
          EOF

          gh pr create \
            --draft \
            --base "$BASE_REF" \
            --head "$BRANCH" \
            --title "docs(test): test design from #${PR_NUM}" \
            --body-file pr-body.md
