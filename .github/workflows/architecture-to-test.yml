name: 测试设计与测试用例

on:
  pull_request:
    types: [closed]
    paths:
      - 'issue_docs/*/Architecture Design/**'
      - 'issue_docs/*/Architecture Desgin/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    if: github.event.pull_request.merged == true
    runs-on: [self-hosted, ai-dev-runner]
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Find Architecture Design files changed in merged PR
        id: arch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Skip files removed by the PR — re-generating stubs for deleted issue dirs would resurrect them.
          gh pr view "$PR_NUM" --json files -q '.files[] | select(.status != "removed") | .path' > pr-files.txt
          grep -E '^issue_docs/[^/]+/Architecture (Design|Desgin)/.+\.md$' pr-files.txt > arch-files.txt || true
          if [ ! -s arch-files.txt ]; then
            echo "No Architecture Design markdown changed; nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Architecture files detected:"
          cat arch-files.txt

      - name: Comment — start
        if: steps.arch.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ARCH_LIST=$(awk '{print "- `" $0 "`"}' arch-files.txt)
          BODY="🟦 \`测试设计与测试用例\` 已触发 — 正在为本 PR 的架构设计生成测试设计说明书与测试用例。

          检测到的架构文档：
          ${ARCH_LIST}

          预计 3-5 分钟完成；进度见 [run 日志](${RUN_URL})。"
          gh issue comment "$PR_NUM" --repo "$REPO" --body "$BODY" || true

      - name: Check 功能设计分解 TASK 清单 section
        if: steps.arch.outputs.found == 'true'
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            if [ ! -f "$f" ]; then
              echo "::warning file=$f::file missing on base branch (deleted in PR?)"
              continue
            fi
            # Tolerate whitespace between 中文 and TASK 清单 (canonical heading is "功能设计分解TASK清单" but allow spaces).
            if grep -Eq '功能设计分解[[:space:]]*TASK[[:space:]]*清单' "$f"; then
              line=$(grep -nE '功能设计分解[[:space:]]*TASK[[:space:]]*清单' "$f" | head -1 | cut -d: -f1)
              echo "::notice file=$f,line=${line}::Found '功能设计分解 TASK 清单' section"
            else
              echo "::warning file=$f::Missing '功能设计分解 TASK 清单' section in architecture doc"
            fi
          done < arch-files.txt

      - name: Fetch Test templates from spec repo
        if: steps.arch.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SPEC_REPO: agentic-develop-playground/agent-development-specification
        run: |
          set -euo pipefail
          mkdir -p /tmp/test-templates
          # spec repo is private; raw.githubusercontent.com returns 404 for anon → use authenticated contents API with raw Accept header.
          gh api "/repos/${SPEC_REPO}/contents/spec/teams/templates/Test/%231%20Test%20Strategy.md" \
            -H "Accept: application/vnd.github.raw" > /tmp/test-templates/test-strategy.md
          gh api "/repos/${SPEC_REPO}/contents/spec/teams/templates/Test/%231%20Test%20Specification.md" \
            -H "Accept: application/vnd.github.raw" > /tmp/test-templates/test-specification.md
          wc -c /tmp/test-templates/*.md

      - name: Setup opencode
        if: steps.arch.outputs.found == 'true'
        env:
          HOME: /home/runner
          OPENCODE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          set -euo pipefail
          if ! command -v opencode >/dev/null 2>&1; then
            npm install -g opencode-ai || curl -fsSL https://opencode.ai/install | bash
          fi
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.opencode/bin:$PATH"
          command -v opencode || { echo "::error::opencode install failed"; exit 1; }
          opencode --version || true
          mkdir -p "$HOME/.local/share/opencode" "$HOME/.config/opencode"
          printf '{"alibaba-cn":{"type":"api","key":"%s"}}\n' "$OPENCODE_API_KEY" > "$HOME/.local/share/opencode/auth.json"
          chmod 600 "$HOME/.local/share/opencode/auth.json"
          printf '{"$schema":"https://opencode.ai/config.json"}\n' > "$HOME/.config/opencode/opencode.json"

      - name: Clone integration-tests for test-case-generator skills
        if: steps.arch.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/it
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/agentic-develop-playground/integration-tests.git" /tmp/it
          echo "=== test_skills_base (general) ==="
          ls /tmp/it/test_skills_base/ 2>/dev/null || echo "  (missing)"
          echo "=== services (per-module) ==="
          ls /tmp/it/services/ 2>/dev/null || echo "  (missing)"

      - name: Generate test design docs via opencode
        if: steps.arch.outputs.found == 'true'
        id: gen
        env:
          HOME: /home/runner
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          OPENCODE_MODEL: alibaba-cn/glm-5
        run: |
          set -euo pipefail
          command -v opencode >/dev/null 2>&1 || { echo "::error::opencode missing from PATH after Setup step"; exit 1; }
          python3 - <<'PY'
          import os, pathlib, re, subprocess, sys

          PR_NUM = os.environ["PR_NUM"]
          PR_URL = os.environ["PR_URL"]
          PR_TITLE = os.environ["PR_TITLE"]

          IT_ROOT = pathlib.Path("/tmp/it")
          GENERAL_SKILL_DIR = IT_ROOT / "test_skills_base" / "test-case-generator"

          MODULE_PATTERN = re.compile(
              r"^##\s*模块归属\s*$.*?^[\s\-]*\*{0,2}module\*{0,2}\s*:\s*([^\s`\"]+)",
              re.MULTILINE | re.DOTALL,
          )

          def extract_module(arch_path):
              try:
                  text = pathlib.Path(arch_path).read_text(encoding="utf-8")
              except OSError:
                  return None
              m = MODULE_PATTERN.search(text)
              return m.group(1).strip() if m else None

          arch_files = [
              l for l in pathlib.Path("arch-files.txt").read_text().splitlines() if l.strip()
          ]
          generated = pathlib.Path("generated-files.txt")
          generated.write_text("")

          for arch_path in arch_files:
              issue_id = arch_path.split("/")[1]
              test_dir = pathlib.Path(f"issue_docs/{issue_id}/Test")
              test_dir.mkdir(parents=True, exist_ok=True)
              report = test_dir / "test-design-report.md"
              cases = test_dir / "test_design_cases.py"

              # Resolve skills: general (always) + module-specific (best-effort).
              module = extract_module(arch_path)
              skill_lines = []
              if GENERAL_SKILL_DIR.is_dir():
                  skill_lines.append(f"- 通用测试用例生成技能（必读）：{GENERAL_SKILL_DIR}/  — 读 SKILL.md 与 references/ 内的指导，按其方法生成用例")
              else:
                  print(f"::warning file={arch_path}::general skill dir {GENERAL_SKILL_DIR} missing; proceeding without it")

              if module:
                  mod_skill_dir = IT_ROOT / "services" / module / "test-case-generator"
                  if mod_skill_dir.is_dir():
                      skill_lines.append(f"- 模块特性测试技能（必读）：{mod_skill_dir}/  — 读 SKILL.md 与 references/ 内容，覆盖 {module} 模块的特定用例约定")
                  else:
                      print(f"::notice file={arch_path}::no per-module skill at {mod_skill_dir}; using general skill only")
              else:
                  print(f"::warning file={arch_path}::cannot extract '## 模块归属' module; using general skill only")

              prompt_lines = [
                  "你是测试设计 agent。本次任务必须一次性跑完，全流程无需任何人工确认。",
                  "",
                  "【输入文档】（请使用 Read 工具读取，再开始产出）",
                  f"1. 架构设计文档：{arch_path}",
                  "2. 测试策略模板：/tmp/test-templates/test-strategy.md",
                  "3. 测试用例规约模板：/tmp/test-templates/test-specification.md",
                  "",
              ]
              if skill_lines:
                  prompt_lines += [
                      "【测试用例生成 skills】（必须 Read 这些 SKILL.md / references 内的指导文件，并按其约定来产出用例）",
                  ] + skill_lines + [""]
              prompt_lines += [
                  "【输出文件】（必须使用 Write 工具完整写出，不要省略、不要缩写）",
                  "",
                  f"文件 1：{report}",
                  "- 以「测试策略模板」结构为骨架",
                  f"- H1 改为 `# #{issue_id} <需求名称> 测试策略设计说明书`，需求名称取自架构文档",
                  f"- 在 H1 之后插入引用块，记录来源架构文档路径 `{arch_path}` 与触发 PR `[#{PR_NUM}]({PR_URL}) — {PR_TITLE}`",
                  "- **必须**将架构文档中的 `## 模块归属` 章节（含 `module: <name>` 行）原样复制到本文件，放在引用块之后、第 1 节之前；如果架构文档没有该章节，则新建一行 `## 模块归属` + `module: <TODO>`（用 TODO 占位，便于下游集成 workflow 识别）",
                  "- 第 1 节「基本信息」按架构文档实际信息填写",
                  "- 第 2 节「测试维度确认」依据架构内容判断需要勾选哪些维度，给出勾选理由",
                  "- 第 3 节按勾选的维度填写专项验证设计，未勾选的小节直接删除",
                  "- 与架构文档「功能设计分解 TASK 清单」逐条对齐，确保每个 TASK 在测试策略中有对应入口",
                  "",
                  f"文件 2：{cases}  ← **必须是可直接 pytest 执行的 Python 脚本（.py），不是 markdown**",
                  "- **格式覆盖**：忽略 skill 中关于 markdown 表格 / agent-exec 块的 output 约定；本次只采纳 skill 的方法论（9 维度覆盖、等价类、边界值、用例命名、可追溯性）。output 形式固定为 Python pytest。",
                  "- 文件头注释：`# #{issue_id} <需求名称> 测试用例（Python pytest 脚本，由 architecture-to-test workflow 生成）`，下面 1-2 行注释写来源 PR 与架构文档路径。",
                  "- 必要 import：`import pytest`，按需 `import requests`、`from unittest import mock` 等。",
                  "- 每个用例一个 `def test_<模块>_<能力>_<序号>(...):` 函数；函数 docstring 写 `[维度标识] 一句话描述`，对应优先级用 `@pytest.mark.p0/p1/p2` 装饰器。",
                  "- 至少覆盖架构文档中每条 SR/AR 与每个 TASK；可使用 `@pytest.mark.parametrize` 合并相邻等价类。",
                  "- 操作步骤用真实可执行代码（curl 改 requests / subprocess、UI 改 Playwright 占位）；预期结果用 assert 断言。",
                  "- 顶部留一个 `pytest.ini` / conftest 风格的 fixtures 区（必要时为空）。",
                  "- 文件末尾追加一段 `# ===== 用例索引（人类导入禅道/Tapd 可贴）=====` 注释块，把所有 test 函数列成 markdown 表格（用例 ID / 标题 / 关联 task / 优先级），便于人类一眼看完覆盖范围。",
                  "",
                  "完成两个文件的写入后停止；不要询问、不要修改其他文件。",
              ]
              prompt = "\n".join(prompt_lines)

              print(f"::group::opencode prompt for #{issue_id}")
              print(prompt)
              print("::endgroup::", flush=True)

              cmd = [
                  "opencode", "run",
                  "--model", os.environ.get("OPENCODE_MODEL", "alibaba-cn/glm-5"),
                  "--agent", "build",
                  "--dangerously-skip-permissions",
                  "--thinking=false",
                  prompt,
              ]
              r = subprocess.run(cmd, text=True)
              if r.returncode != 0:
                  print(f"::error::opencode exited {r.returncode} for #{issue_id}", file=sys.stderr)
                  sys.exit(r.returncode)

              missing = []
              for label, p in (("report", report), ("cases", cases)):
                  if not p.is_file() or p.stat().st_size == 0:
                      missing.append(f"{label}={p}")
              if missing:
                  print(
                      f"::error::expected files missing/empty for #{issue_id}: {', '.join(missing)}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              with generated.open("a") as f:
                  f.write(f"{report}\n{cases}\n")
              print(
                  f"::notice::Generated #{issue_id}: report={report.stat().st_size}B cases={cases.stat().st_size}B"
              )
          PY

          echo "count=$(wc -l < generated-files.txt)" >> "$GITHUB_OUTPUT"

      - name: Open draft PR with generated test docs
        id: draft
        if: steps.gen.outputs.count != '' && steps.gen.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          BRANCH="bot/test-docs-from-pr-${PR_NUM}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Defensive: actions/checkout's persisted credentials can be lost
          # between steps on self-hosted runners. Re-embed the org PAT in
          # the origin URL so push always has auth.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # -B: reset local branch if a stale copy was left by a prior failed run
          git checkout -B "$BRANCH"
          while IFS= read -r p; do git add -- "$p"; done < generated-files.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "docs(test): generate stub test design docs from PR #${PR_NUM}"
          # --force: this bot branch is wholly workflow-owned and re-runs (or
          # earlier-failed runs that left stale tips) must overwrite cleanly.
          git push -u --force origin "$BRANCH"

          cat > pr-body.md <<EOF
          Auto-generated draft from merged PR [#${PR_NUM}](${PR_URL}) — ${PR_TITLE}.

          Source architecture file(s):

          \`\`\`
          $(cat arch-files.txt)
          \`\`\`

          Stub content — replace with AI Agent output once wired up.
          EOF

          DRAFT_URL=$(gh pr create \
            --draft \
            --base "$BASE_REF" \
            --head "$BRANCH" \
            --title "docs(test): test design from #${PR_NUM}" \
            --body-file pr-body.md)
          echo "draft_pr_url=$DRAFT_URL" >> "$GITHUB_OUTPUT"
          echo "::notice::draft PR opened: $DRAFT_URL"

      - name: Comment — done
        if: steps.gen.outputs.count != '' && steps.gen.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          DRAFT_URL: ${{ steps.draft.outputs.draft_pr_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="✅ \`测试设计与测试用例\` 已完成。

          自动生成的测试设计草稿 PR：${DRAFT_URL}

          内容：
          - 测试策略说明书：\`test-design-report.md\` (markdown)
          - 测试用例：\`test_design_cases.py\` (pytest)

          测试专家可在草稿 PR 上评论：
          - \`/accept\` — 转为正式 PR 进入合入流程
          - 任意修改意见 — 触发 \`测试交付件修复\` 自动追加修订

          run 日志：${RUN_URL}"
          gh issue comment "$PR_NUM" --repo "$REPO" --body "$BODY" || true

      - name: Comment — failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$PR_NUM" --repo "$REPO" --body "❌ \`测试设计与测试用例\` 执行异常，详见 [run 日志](${RUN_URL})。修复后可在 Actions 页面 re-run 重试。" || true
