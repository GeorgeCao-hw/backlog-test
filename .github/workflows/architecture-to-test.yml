name: 测试设计与测试用例

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    if: github.event.pull_request.merged == true
    runs-on: ai-dev-runner
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Find Architecture Design files changed in merged PR
        id: arch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Skip files removed by the PR — re-generating stubs for deleted issue dirs would resurrect them.
          gh pr view "$PR_NUM" --json files -q '.files[] | select(.status != "removed") | .path' > pr-files.txt
          grep -E '^issue_docs/[^/]+/Architecture (Design|Desgin)/.+\.md$' pr-files.txt > arch-files.txt || true
          if [ ! -s arch-files.txt ]; then
            echo "No Architecture Design markdown changed; nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Architecture files detected:"
          cat arch-files.txt

      - name: Check 功能设计分解 TASK 清单 section
        if: steps.arch.outputs.found == 'true'
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            if [ ! -f "$f" ]; then
              echo "::warning file=$f::file missing on base branch (deleted in PR?)"
              continue
            fi
            # Tolerate whitespace between 中文 and TASK 清单 (canonical heading is "功能设计分解TASK清单" but allow spaces).
            if grep -Eq '功能设计分解[[:space:]]*TASK[[:space:]]*清单' "$f"; then
              line=$(grep -nE '功能设计分解[[:space:]]*TASK[[:space:]]*清单' "$f" | head -1 | cut -d: -f1)
              echo "::notice file=$f,line=${line}::Found '功能设计分解 TASK 清单' section"
            else
              echo "::warning file=$f::Missing '功能设计分解 TASK 清单' section in architecture doc"
            fi
          done < arch-files.txt

      - name: Generate test design docs from spec templates
        if: steps.arch.outputs.found == 'true'
        id: gen
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          STRATEGY_TEMPLATE_URL: https://raw.githubusercontent.com/agentic-develop-playground/agent-development-specification/main/spec/teams/templates/Test/%231%20Test%20Strategy.md
          SPEC_TEMPLATE_URL: https://raw.githubusercontent.com/agentic-develop-playground/agent-development-specification/main/spec/teams/templates/Test/%231%20Test%20Specification.md
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, urllib.request

          def fetch(url):
              with urllib.request.urlopen(url, timeout=30) as r:
                  return r.read().decode("utf-8")

          def render(template, old_title, new_title, arch_file):
              body = template.replace(old_title, new_title, 1)
              header = (
                  f"> 由 GitHub Action 自动生成（模板来自 agent-development-specification spec/teams/templates/Test/）。\n"
                  f"> 源架构文档：`{arch_file}`\n"
                  f"> 触发 PR：[#{os.environ['PR_NUM']}]({os.environ['PR_URL']}) — {os.environ['PR_TITLE']}\n\n"
              )
              lines = body.splitlines(keepends=True)
              out, inserted = [], False
              for ln in lines:
                  out.append(ln)
                  if not inserted and ln.startswith("# "):
                      out.append("\n")
                      out.append(header)
                      inserted = True
              return "".join(out)

          strategy_tpl = fetch(os.environ["STRATEGY_TEMPLATE_URL"])
          spec_tpl = fetch(os.environ["SPEC_TEMPLATE_URL"])

          arch_lines = [
              l for l in pathlib.Path("arch-files.txt").read_text().splitlines() if l.strip()
          ]

          with pathlib.Path("generated-files.txt").open("w") as gen_log:
              for arch_path in arch_lines:
                  issue_id = arch_path.split("/")[1]
                  test_dir = pathlib.Path(f"issue_docs/{issue_id}/Test")
                  test_dir.mkdir(parents=True, exist_ok=True)
                  report_path = test_dir / "test-design-report.md"
                  cases_path = test_dir / "test-design-cases.md"
                  report_path.write_text(
                      render(
                          strategy_tpl,
                          "# #1 [需求名称] 测试策略设计说明书",
                          f"# #{issue_id} 测试策略设计说明书",
                          arch_path,
                      ),
                      encoding="utf-8",
                  )
                  cases_path.write_text(
                      render(
                          spec_tpl,
                          "# #1 Test Specification",
                          f"# #{issue_id} Test Specification",
                          arch_path,
                      ),
                      encoding="utf-8",
                  )
                  gen_log.write(f"{report_path}\n{cases_path}\n")
                  print(f"generated for #{issue_id}: {report_path}, {cases_path}")
          PY

          echo "count=$(wc -l < generated-files.txt)" >> "$GITHUB_OUTPUT"

      - name: Open draft PR with generated test docs
        if: steps.gen.outputs.count != '' && steps.gen.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          BRANCH="bot/test-docs-from-pr-${PR_NUM}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          while IFS= read -r p; do git add -- "$p"; done < generated-files.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "docs(test): generate stub test design docs from PR #${PR_NUM}"
          git push -u origin "$BRANCH"

          cat > pr-body.md <<EOF
          Auto-generated draft from merged PR [#${PR_NUM}](${PR_URL}) — ${PR_TITLE}.

          Source architecture file(s):

          \`\`\`
          $(cat arch-files.txt)
          \`\`\`

          Stub content — replace with AI Agent output once wired up.
          EOF

          gh pr create \
            --draft \
            --base "$BASE_REF" \
            --head "$BRANCH" \
            --title "docs(test): test design from #${PR_NUM}" \
            --body-file pr-body.md
