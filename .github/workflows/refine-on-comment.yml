name: 测试交付件评审

# TSE 自动评审：当测试设计草稿 PR（含 issue_docs/*/Test/ 交付件）出现或更新时，
# 由测试 TSE agent 评审测试策略说明书 + 测试用例脚本：
#   - 通过 → gh pr ready + gh pr merge（自动转正式并合入）
#   - 不通过 → 在草稿 PR 回评问题清单，留人工处理（人工推修订后 synchronize 自动重审）
#
# 触发用 pull_request（不是 issue_comment）——天然无评论回环问题。

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'issue_docs/*/Test/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 只评审本仓的草稿 PR（fork PR 无法安全 checkout/merge）。
    if: >-
      github.event.pull_request.draft == true
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ai-dev-runner]
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate test deliverables in PR
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUM" --repo "$REPO" --json files -q '.files[].path' > pr-files.txt
          grep -E '^issue_docs/[^/]+/Test/(test-design-report\.md|test_design_cases\.py)$' pr-files.txt > target-files.txt || true
          if [ ! -s target-files.txt ]; then
            echo "::notice::No test deliverables (test-design-report.md / test_design_cases.py) in PR; skipping review."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Review targets:"
          cat target-files.txt

      - name: Fetch TSE review agent spec
        if: steps.files.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SPEC_REPO: agentic-develop-playground/agent-development-specification
        run: |
          set -euo pipefail
          mkdir -p ${RUNNER_TEMP}/review
          gh api "/repos/${SPEC_REPO}/contents/spec/teams/agents/tester/Test-Review-Agent.md" \
            -H "Accept: application/vnd.github.raw" > ${RUNNER_TEMP}/review/agent.md
          wc -c ${RUNNER_TEMP}/review/agent.md

      - name: Setup opencode
        if: steps.files.outputs.found == 'true'
        env:
          HOME: /home/runner
          OPENCODE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          set -euo pipefail
          if ! command -v opencode >/dev/null 2>&1; then
            npm install -g opencode-ai || curl -fsSL https://opencode.ai/install | bash
          fi
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.opencode/bin:$PATH"
          command -v opencode || { echo "::error::opencode install failed"; exit 1; }
          opencode --version || true
          mkdir -p "$HOME/.local/share/opencode" "$HOME/.config/opencode"
          printf '{"alibaba-cn":{"type":"api","key":"%s"}}\n' "$OPENCODE_API_KEY" > "$HOME/.local/share/opencode/auth.json"
          chmod 600 "$HOME/.local/share/opencode/auth.json"
          printf '{"$schema":"https://opencode.ai/config.json"}\n' > "$HOME/.config/opencode/opencode.json"

      - name: Review via opencode (TSE)
        id: review
        if: steps.files.outputs.found == 'true'
        env:
          HOME: /home/runner
          OPENCODE_MODEL: alibaba-cn/glm-5
        run: |
          set -euo pipefail
          command -v opencode >/dev/null 2>&1 || { echo "::error::opencode missing from PATH after Setup"; exit 1; }
          rm -f .review-verdict.md
          python3 - <<'PY'
          import os, pathlib, subprocess, sys

          RT = os.environ["RUNNER_TEMP"]
          role = pathlib.Path(f"{RT}/review/agent.md").read_text(encoding="utf-8")

          targets = [l.strip() for l in pathlib.Path("target-files.txt").read_text().splitlines() if l.strip()]
          reports = [t for t in targets if t.endswith("test-design-report.md")]
          cases = [t for t in targets if t.endswith("test_design_cases.py")]

          review_inputs = []
          n = 1
          for r in reports:
              review_inputs.append(f"{n}. 测试策略说明书：{r}")
              n += 1
          for c in cases:
              review_inputs.append(f"{n}. 测试用例脚本（pytest）：{c}")
              n += 1

          arch_hint = []
          for r in reports:
              issue_id = r.split("/")[1]
              if pathlib.Path(f"issue_docs/{issue_id}/Architecture Design").is_dir():
                  arch_hint.append(f"- 可选核对覆盖：issue_docs/{issue_id}/Architecture Design/ 下的架构设计文档")

          prompt = role + "\n\n" + "\n".join([
              "================ 本次任务 ================",
              "",
              "【评审对象】（用 Read 读取）",
              *review_inputs,
              *(["", *arch_hint] if arch_hint else []),
              "",
              "【裁决输出】",
              "- 把评审裁决写入仓库根的 `.review-verdict.md`；第一行必须严格是 `VERDICT: PASS` 或 `VERDICT: FAIL`。",
              "- FAIL 时第一行之后逐条列出问题（文件+位置 | 问题 | 期望/建议）。",
              "- 只写 `.review-verdict.md` 这一个文件，绝不修改被评审的文件。",
          ])

          print("::group::opencode TSE review prompt")
          print(prompt)
          print("::endgroup::", flush=True)

          r = subprocess.run(
              ["opencode", "run",
               "--model", os.environ.get("OPENCODE_MODEL", "alibaba-cn/glm-5"),
               "--agent", "build",
               "--dangerously-skip-permissions",
               "--thinking=false",
               prompt],
              text=True,
          )
          if r.returncode != 0:
              print(f"::error::opencode exited {r.returncode}", file=sys.stderr)
              sys.exit(r.returncode)
          PY
          if [ ! -f .review-verdict.md ]; then
            echo "::error::TSE agent did not produce .review-verdict.md"
            exit 1
          fi
          echo "::group::verdict file"; cat .review-verdict.md; echo "::endgroup::"
          VERDICT=$(head -1 .review-verdict.md | grep -oE 'PASS|FAIL' | head -1 || true)
          [ -z "$VERDICT" ] && VERDICT=FAIL
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "::notice::TSE verdict=$VERDICT"

      - name: PASS → promote draft to ready + merge
        if: steps.files.outputs.found == 'true' && steps.review.outputs.verdict == 'PASS'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUM" --repo "$REPO" --body "✅ \`测试交付件评审\`（TSE）通过 — 自动将草稿 PR 转为正式并合入。

          run 日志：${RUN_URL}" || true
          gh pr ready "$PR_NUM" --repo "$REPO"
          gh pr merge "$PR_NUM" --repo "$REPO" --merge --admin --delete-branch

      - name: FAIL → comment issues, leave draft for human
        if: steps.files.outputs.found == 'true' && steps.review.outputs.verdict != 'PASS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "❌ \`测试交付件评审\`（TSE）未通过 — 请按以下问题修订后推送（推送会自动重审）："
            echo
            cat .review-verdict.md
            echo
            echo "run 日志：${RUN_URL}"
          } > "${RUNNER_TEMP}/review-comment.md"
          gh pr comment "$PR_NUM" --repo "$REPO" --body-file "${RUNNER_TEMP}/review-comment.md" || true

      - name: Comment — infra failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUM" --repo "$REPO" --body "⚠️ \`测试交付件评审\` 执行异常（非评审结论），详见 [run 日志](${RUN_URL})。修复后推送或 re-run。" || true
