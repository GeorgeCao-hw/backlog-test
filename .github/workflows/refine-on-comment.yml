name: 测试交付件修复

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refine-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # Two trigger conditions are gated explicitly in this preflight:
  #   1) the PR being commented on is a DRAFT in the current repo
  #   2) that draft PR touches paths matching 'issue_docs/*/Test/**'
  # 'act' only runs when both pass (gate.outputs.go == 'true').
  gate:
    if: >-
      github.event.issue.pull_request != null
      && github.event.comment.user.type != 'Bot'
      && !endsWith(github.event.comment.user.login, '-bot')
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
      mode: ${{ steps.mode.outputs.mode }}
      head_ref: ${{ steps.decide.outputs.head_ref }}
      head_repo: ${{ steps.decide.outputs.head_repo }}
    steps:
      - name: Parse comment mode
        id: mode
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          first_line=$(printf '%s' "$COMMENT_BODY" | awk 'NF{print; exit}' | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          if [ "$first_line" = "/accept" ]; then
            echo "mode=accept" >> "$GITHUB_OUTPUT"
          else
            echo "mode=refine" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide go/no-go (draft + Test/ path)
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          DATA=$(gh api "/repos/${REPO}/pulls/${PR_NUM}")
          IS_DRAFT=$(echo "$DATA" | jq -r '.draft')
          HEAD_REF=$(echo "$DATA" | jq -r '.head.ref')
          HEAD_REPO=$(echo "$DATA" | jq -r '.head.repo.full_name')
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "head_repo=$HEAD_REPO" >> "$GITHUB_OUTPUT"

          # Condition 1: PR must be a draft.
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::notice::PR #${PR_NUM} is not a draft; gate=no-go (condition 1 failed)."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Condition 2: PR must touch issue_docs/*/Test/** paths.
          if gh pr view "$PR_NUM" --repo "$REPO" --json files -q '.files[].path' \
             | grep -qE '^issue_docs/[^/]+/Test/'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #${PR_NUM} is a draft with issue_docs/*/Test/ files; gate=go."
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #${PR_NUM} has no issue_docs/*/Test/ files; gate=no-go (condition 2 failed)."
          fi

  act:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      # /accept on a draft PR → convert to ready-for-review, then stop.
      - name: Mark draft PR ready for review
        if: needs.gate.outputs.mode == 'accept'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh pr ready "$PR_NUM" --repo "$REPO"
          gh api -X POST -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content="+1" >/dev/null
          echo "::notice::PR #${PR_NUM} marked ready for review (triggered by /accept)"
          gh issue comment "$PR_NUM" --repo "$REPO" --body "✅ \`/accept\` 已生效 — 草稿 PR 已转为正式 PR，进入合入门禁流程。

          run 日志：${RUN_URL}" || true

      - name: Comment — refine start
        if: needs.gate.outputs.mode == 'refine' && needs.gate.outputs.head_repo == github.repository
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.issue.number }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$PR_NUM" --repo "$REPO" --body "👀 \`测试交付件修复\` 已触发 — 正在根据评论修订测试设计/用例。

          - 触发评论：${COMMENT_URL}
          - run 日志：${RUN_URL}" || true

      - name: React with 'eyes'
        if: needs.gate.outputs.mode == 'refine' && needs.gate.outputs.head_repo == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api -X POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content=eyes >/dev/null

      - name: Checkout PR head branch
        if: needs.gate.outputs.mode == 'refine' && needs.gate.outputs.head_repo == github.repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate test design files in PR
        id: files
        if: needs.gate.outputs.mode == 'refine' && needs.gate.outputs.head_repo == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUM" --json files -q '.files[].path' > pr-files.txt
          grep -E '^issue_docs/[^/]+/Test/(test-design-report\.md|test_design_cases\.py)$' pr-files.txt > target-files.txt || true
          if [ ! -s target-files.txt ]; then
            echo "::notice::No test-design-report.md or test_design_cases.py in this PR; nothing to refine."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Target files:"
          cat target-files.txt

      - name: Refine docs with AI agent (stub)
        if: steps.files.outputs.found == 'true'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_AT: ${{ github.event.comment.created_at }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/refine-note.md
          import os
          body = os.environ.get("COMMENT_BODY", "")
          quoted = "\n".join("> " + ln for ln in body.splitlines()) or "> (empty)"
          print(f"""
          ---

          ### 自动修订（占位 stub）

          > 由 GitHub Action 自动写入，待 AI Agent 接入后替换为实际修订内容。
          > 评论：[{os.environ['COMMENT_URL']}]({os.environ['COMMENT_URL']}) by **@{os.environ['COMMENT_USER']}** at {os.environ['COMMENT_AT']}

          原始评论：

          {quoted}
          """)
          PY
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            cat /tmp/refine-note.md >> "$f"
            echo "appended revision note to $f"
          done < target-files.txt

      - name: Commit and push to PR branch
        id: push
        if: steps.files.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Defensive: re-embed org PAT in origin URL (persisted credentials
          # from actions/checkout can be lost between steps on self-hosted runners).
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          while IFS= read -r f; do
            [ -f "$f" ] && git add -- "$f"
          done < target-files.txt
          if git diff --cached --quiet; then
            echo "No effective changes; skipping push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "docs(test): refine via comment ${COMMENT_ID} on PR #${PR_NUM}"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Final reaction
        if: always() && needs.gate.outputs.mode == 'refine' && needs.gate.outputs.head_repo == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          PUSHED: ${{ steps.push.outputs.pushed }}
        run: |
          if [ "$PUSHED" = "true" ]; then
            REACT=rocket
          else
            REACT=confused
          fi
          gh api -X POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content="$REACT" >/dev/null

      - name: Comment — refine done
        if: needs.gate.outputs.mode == 'refine' && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.issue.number }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$PR_NUM" --repo "$REPO" --body "🚀 \`测试交付件修复\` 已完成 — 根据评论的修订已追加为新 commit，请再次 review。

          - 触发评论：${COMMENT_URL}
          - run 日志：${RUN_URL}

          继续评论可多轮迭代；评论 \`/accept\` 转为正式 PR。" || true

      - name: Comment — failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$PR_NUM" --repo "$REPO" --body "❌ \`测试交付件修复\` 执行异常，详见 [run 日志](${RUN_URL})。请检查后重新评论触发，或在 Actions 页面 re-run。" || true
