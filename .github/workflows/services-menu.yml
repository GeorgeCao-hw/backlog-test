# 多服务统一「菜单 + 转发」workflow（取代旧的 forward-to-datacenter.yml）
#
# 由 .github/services/<id>.yaml 驱动 —— 加新服务只需要往 services/ 加 YAML，本文件不动。
#
# 做两件事：
#   1) menu 任务：评论命中 `<service>.menu.trigger` 或 accepted label 被加上时 → 贴该服务的命令菜单
#   2) forward 任务：评论以某条 `handler: forward` 命令的 trigger 开头 → repository_dispatch 到外仓
#
# 前置：
#   - 仓 Secrets → Actions 需配置 DATACENTER_DISPATCH_TOKEN（PAT，对目标仓如
#     opensourceways/om-datacenter 有 `contents: write` / 经典 PAT 的 `repo`；fine-grained
#     还要 `metadata: read`）。当前仅数据中台的 implement / release 走 forward 用得到；
#     未来要转发到其它仓也用这同一个 token（或在 .github/services/<id>.yaml 里写自己的 secret 名再扩展本 workflow）。
#   - 服务对应的 `required_label`（默认 accepted）需要在本仓 Labels 里实际存在。
#
# 关键事件流：
#   - issue 评论 `[数据中台需求]`（有 accepted）→ menu 任务贴菜单
#   - issue 评论 `[数据中台需求]`（无 accepted）→ menu 任务贴「需要先打 accepted 标签」提示
#   - issue 加 accepted 标签（历史里有人评过 `[数据中台需求]`）→ menu 任务补贴菜单
#   - issue 评论 `[数据中台需求实现] xxx` → forward 任务发 backlog_implement 到 om-datacenter
#   - issue 评论 `[数据中台需求分析] xxx` / `[机器人需求分析] xxx`（handler=in-repo） → forward 任务 no-op，
#     由 .github/workflows/analyze-requirement.yml 接管

name: Services menu + forward

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  # ───────────────────────── 1) 贴服务菜单（或缺 label 提示） ─────────────────────────
  menu:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.state == 'open') ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.issue.state == 'open')
    runs-on: [self-hosted, ai-design-runner]   # 2026-05-15 改 self-hosted 绕开 GitHub Actions ubuntu-latest 配额耗尽问题；任务极轻（<30s），跟 analyze 共享一台 runner 不冲突
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}           # 用 gh CLI 必须显式（不 checkout 也能用）
      ISSUE: ${{ github.event.issue.number }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_ACTION: ${{ github.event.action }}
      LABEL_ADDED: ${{ github.event.label.name }}    # issues.labeled 事件才有
      COMMENT_BODY: ${{ github.event.comment.body }} # issue_comment 事件才有
    steps:
      - name: Checkout (读 .github/services/*.yaml 和 .github/scripts/services.py)
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Decide & post menu / nag
        run: python3 .github/scripts/services.py menu

  # ───────────────────────── 2) 把 forward 命令转发到目标仓 ─────────────────────────
  forward:
    if: github.event_name == 'issue_comment' && github.event.issue.state == 'open'
    runs-on: [self-hosted, ai-design-runner]   # 2026-05-15 改 self-hosted 绕开 GitHub Actions ubuntu-latest 配额耗尽问题；任务极轻（<30s），跟 analyze 共享一台 runner 不冲突
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}                  # 回评 issue 用本仓 token
      DISPATCH_TOKEN: ${{ secrets.DATACENTER_DISPATCH_TOKEN }}   # 发 dispatch 用跨仓 PAT
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      COMMENT_ID: ${{ github.event.comment.id }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      TRIGGER_USER: ${{ github.event.comment.user.login }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Decide & dispatch
        run: python3 .github/scripts/services.py forward
