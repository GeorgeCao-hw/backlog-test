name: 模块测试集成

on:
  pull_request:
    types: [closed]
    paths:
      - 'issue_docs/*/Test/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  aggregate:
    if: github.event.pull_request.merged == true
    runs-on: [self-hosted, ai-dev-runner]
    timeout-minutes: 30
    steps:
      - name: Checkout backlog
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Find per-issue test deliverables in merged PR
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUM" --json files \
            -q '.files[] | select(.status != "removed") | .path' > pr-files.txt
          grep -E '^issue_docs/[^/]+/Test/(test-design-report\.md|test_design_cases\.py)$' pr-files.txt > deliv-files.txt || true
          if [ ! -s deliv-files.txt ]; then
            echo "::notice::No per-issue test deliverables changed; nothing to aggregate."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          awk -F'/' '{print $2}' deliv-files.txt | sort -u > issue-ids.txt
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Affected issues: $(paste -sd, issue-ids.txt)"

      - name: Extract module per issue
        if: steps.scan.outputs.found == 'true'
        id: modules
        run: |
          set -euo pipefail
          : > issue-module-map.txt
          while IFS= read -r issue_id; do
            f="issue_docs/${issue_id}/Test/test-design-report.md"
            if [ ! -f "$f" ]; then
              echo "::warning::missing $f"
              continue
            fi
            mod=$(awk '
              /^## 模块归属/{found=1; next}
              found && /^## /{found=0}
              found && /^[[:space:]]*-?[[:space:]]*\**module\**[[:space:]]*:[[:space:]]*[^[:space:]]/{
                sub(/^[[:space:]]*-?[[:space:]]*\**module\**[[:space:]]*:[[:space:]]*/, "");
                sub(/[[:space:]]+$/, "");
                print; exit
              }
              found && /^[^[:space:]#-]/{
                print; exit
              }' "$f")
            mod=$(echo "$mod" | tr -d '`' | tr -d '"' | awk '{print $1}')
            # Skip placeholder values like <TODO>/<TBD>
            if echo "$mod" | grep -qE '^<.*>$'; then
              echo "::warning file=$f::模块名是占位符 '${mod}'（issue #${issue_id} 的架构设计未填写模块归属）— 跳过"
              continue
            fi
            if [ -z "$mod" ]; then
              echo "::warning file=$f::missing '## 模块归属' section or 'module: <name>' line — skipping"
              continue
            fi
            echo "$issue_id $mod" >> issue-module-map.txt
            echo "::notice::#${issue_id} → module=${mod}"
          done < issue-ids.txt
          if [ ! -s issue-module-map.txt ]; then
            echo "::warning::no modules extracted; aborting"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Comment — start
        if: steps.modules.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MAP=$(awk '{print "- #" $1 " → `" $2 "`"}' issue-module-map.txt)
          BODY="🟦 \`模块测试集成\` 已触发 — 正在将测试用例合并到 integration-tests 仓的对应模块。

          需求 → 模块映射：
          ${MAP}

          预计 2-4 分钟完成；进度见 [run 日志](${RUN_URL})。"
          gh issue comment "$PR_NUM" --repo "$REPO" --body "$BODY" || true

      - name: Fetch Test templates from spec repo
        if: steps.modules.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SPEC_REPO: agentic-develop-playground/agent-development-specification
        run: |
          set -euo pipefail
          mkdir -p ${RUNNER_TEMP}/test-templates
          gh api "/repos/${SPEC_REPO}/contents/spec/teams/templates/Test/%231%20Test%20Strategy.md" \
            -H "Accept: application/vnd.github.raw" > ${RUNNER_TEMP}/test-templates/test-strategy.md
          gh api "/repos/${SPEC_REPO}/contents/spec/teams/templates/Test/%231%20Test%20Specification.md" \
            -H "Accept: application/vnd.github.raw" > ${RUNNER_TEMP}/test-templates/test-specification.md
          # Agent role spec — single source of truth for the integration (merge) agent.
          gh api "/repos/${SPEC_REPO}/contents/spec/teams/agents/integration-test/AGENT.md" \
            -H "Accept: application/vnd.github.raw" > ${RUNNER_TEMP}/test-templates/integration-test-agent.md
          wc -c ${RUNNER_TEMP}/test-templates/*.md

      - name: Setup opencode
        if: steps.modules.outputs.found == 'true'
        env:
          HOME: /home/runner
          OPENCODE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          set -euo pipefail
          if ! command -v opencode >/dev/null 2>&1; then
            npm install -g opencode-ai || curl -fsSL https://opencode.ai/install | bash
          fi
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.opencode/bin:$PATH"
          command -v opencode || { echo "::error::opencode install failed"; exit 1; }
          opencode --version || true
          mkdir -p "$HOME/.local/share/opencode" "$HOME/.config/opencode"
          printf '{"alibaba-cn":{"type":"api","key":"%s"}}\n' "$OPENCODE_API_KEY" > "$HOME/.local/share/opencode/auth.json"
          chmod 600 "$HOME/.local/share/opencode/auth.json"
          printf '{"$schema":"https://opencode.ai/config.json"}\n' > "$HOME/.config/opencode/opencode.json"

      - name: Clone integration-tests
        if: steps.modules.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf ${RUNNER_TEMP}/it
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/agentic-develop-playground/integration-tests.git" ${RUNNER_TEMP}/it
          ls ${RUNNER_TEMP}/it/services/ || true

      - name: Merge per-issue deliverables into module files via opencode
        if: steps.modules.outputs.found == 'true'
        env:
          HOME: /home/runner
          OPENCODE_MODEL: alibaba-cn/glm-5
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          command -v opencode >/dev/null 2>&1 || { echo "::error::opencode missing from PATH after Setup"; exit 1; }
          python3 - <<'PY'
          import os, pathlib, subprocess, sys

          PR_NUM = os.environ["PR_NUM"]
          PR_URL = os.environ["PR_URL"]
          PR_TITLE = os.environ["PR_TITLE"]
          RT = os.environ["RUNNER_TEMP"]
          IT_ROOT = pathlib.Path(RT) / "it"

          # Agent capability (role / methodology / merge + output rules) is the
          # single source of truth — fetched to integration-test-agent.md. The
          # step only assembles a per-task instance block (concrete paths);
          # skill resolution is delegated to the agent.
          role = pathlib.Path(f"{RT}/test-templates/integration-test-agent.md").read_text(encoding="utf-8")

          mod_to_issues = {}
          for line in pathlib.Path("issue-module-map.txt").read_text().splitlines():
              if not line.strip():
                  continue
              parts = line.split(None, 1)
              if len(parts) < 2:
                  continue
              issue_id, mod = parts[0], parts[1].strip()
              mod_to_issues.setdefault(mod, []).append(issue_id)

          touched_modules = []
          for mod, issues in mod_to_issues.items():
              mod_dir = IT_ROOT / "services" / mod
              mod_dir.mkdir(parents=True, exist_ok=True)
              strategy_path = mod_dir / "TestStrategy.md"
              cases_path = mod_dir / "test_cases.py"

              per_issue = []
              for issue_id in issues:
                  per_issue += [
                      f"- issue #{issue_id} 测试策略：issue_docs/{issue_id}/Test/test-design-report.md",
                      f"- issue #{issue_id} 测试用例：issue_docs/{issue_id}/Test/test_design_cases.py",
                  ]

              prompt = role + "\n\n" + "\n".join([
                  "================ 本次任务 ================",
                  "",
                  f"【目标模块】services/{mod}/",
                  "",
                  "【模块已有交付件】（Read 后决定融合方式；不存在则用模板新建）",
                  f"- 模块测试策略：{strategy_path}",
                  f"- 模块全量用例：{cases_path}",
                  "",
                  "【上游模板（模块文件不存在时用作骨架）】",
                  f"- 测试策略模板：{RT}/test-templates/test-strategy.md",
                  f"- 测试用例规约模板：{RT}/test-templates/test-specification.md",
                  "",
                  "【测试用例生成 skills】（必读；目录不存在则跳过该项）",
                  f"- 通用：{IT_ROOT}/test_skills_base/test-case-generator/",
                  f"- 模块特性：{IT_ROOT}/services/{mod}/test-case-generator/",
                  "",
                  f"【本次合入的单需求交付件】（涉及 issue：{', '.join(issues)}）",
                  *per_issue,
                  "",
                  "【输出文件】（用 Write 完整写出）",
                  f"- 文件 1（模块测试策略，markdown）：{strategy_path}",
                  f"- 文件 2（模块全量用例，pytest）：{cases_path}",
                  "",
                  f"来源 PR=[#{PR_NUM}]({PR_URL}) — {PR_TITLE}；函数名冲突时新增条目加后缀 _pr_{PR_NUM}",
              ])

              print(f"::group::opencode prompt for module={mod}")
              print(prompt)
              print("::endgroup::", flush=True)

              cmd = [
                  "opencode", "run",
                  "--model", os.environ.get("OPENCODE_MODEL", "alibaba-cn/glm-5"),
                  "--agent", "build",
                  "--dangerously-skip-permissions",
                  "--thinking=false",
                  prompt,
              ]
              r = subprocess.run(cmd, text=True)
              if r.returncode != 0:
                  print(f"::error::opencode exited {r.returncode} for module={mod}", file=sys.stderr)
                  sys.exit(r.returncode)

              missing = []
              if not strategy_path.is_file() or strategy_path.stat().st_size == 0:
                  missing.append(str(strategy_path))
              if not cases_path.is_file() or cases_path.stat().st_size == 0:
                  missing.append(str(cases_path))
              if missing:
                  print(f"::error::expected files missing/empty for module={mod}: {', '.join(missing)}", file=sys.stderr)
                  sys.exit(1)

              touched_modules.append(mod)
              print(f"::notice::merged module={mod} (strategy={strategy_path.stat().st_size}B cases={cases_path.stat().st_size}B)")

          pathlib.Path("touched-modules.txt").write_text("\n".join(touched_modules) + "\n")
          PY

      - name: Open draft PR to integration-tests
        id: draft
        if: steps.modules.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          cd ${RUNNER_TEMP}/it
          BRANCH="bot/aggregate-from-backlog-pr-${PR_NUM}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -B: reset local branch if a stale copy was left by a prior failed run
          git checkout -B "$BRANCH"
          while IFS= read -r mod; do
            [ -z "$mod" ] && continue
            git add "services/$mod/TestStrategy.md" "services/$mod/test_cases.py" || true
          done < "$GITHUB_WORKSPACE/touched-modules.txt"
          if git diff --cached --quiet; then
            echo "::notice::No effective changes; skipping PR."
            exit 0
          fi
          MODS=$(paste -sd, "$GITHUB_WORKSPACE/touched-modules.txt")
          git commit -m "docs(test): integrate test deliverables from backlog PR #${PR_NUM} (modules: ${MODS})"
          # --force: bot branch is wholly workflow-owned; re-runs must overwrite stale tips.
          git push -u --force origin "$BRANCH"

          cat > ${RUNNER_TEMP}/pr-body.md <<EOF
          Auto-generated draft from merged backlog PR [#${PR_NUM}](${PR_URL}) — ${PR_TITLE}.

          Modules updated: \`${MODS}\`

          Per-issue test deliverables from backlog were merged via opencode into each module's \`TestStrategy.md\` (strategy doc, markdown) + \`test_cases.py\` (pytest script). Existing module content was preserved; new entries were appended.
          EOF

          DRAFT_URL=$(gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "docs(test): integrate from backlog #${PR_NUM} (${MODS})" \
            --body-file ${RUNNER_TEMP}/pr-body.md \
            --repo agentic-develop-playground/integration-tests)
          echo "draft_pr_url=$DRAFT_URL" >> "$GITHUB_OUTPUT"
          echo "modules=$MODS" >> "$GITHUB_OUTPUT"
          echo "::notice::draft PR opened: $DRAFT_URL"

      - name: Comment — done
        if: steps.draft.outputs.draft_pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          DRAFT_URL: ${{ steps.draft.outputs.draft_pr_url }}
          MODS: ${{ steps.draft.outputs.modules }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$PR_NUM" --repo "$REPO" --body "✅ \`模块测试集成\` 已完成。

          已将本 PR 的测试交付件合并到 \`integration-tests\` 仓的模块：\`${MODS}\`

          - 跨仓草稿 PR：${DRAFT_URL}
          - 内容：\`services/<module>/TestStrategy.md\` + \`services/<module>/test_cases.py\`
          - 既有模块内容已保留；新条目追加在末尾

          run 日志：${RUN_URL}" || true

      - name: Comment — failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$PR_NUM" --repo "$REPO" --body "❌ \`模块测试集成\` 执行异常，详见 [run 日志](${RUN_URL})。修复后可在 Actions 页面 re-run 重试。" || true

