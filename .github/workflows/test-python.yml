# 跑 tests/ 下面的 pytest（目前只覆盖 .github/scripts/services.py）。
# 触发：
#   - PR 改了 .github/scripts/、tests/、.github/services/ 中任一处
#   - push 到 main 时也跑一遍兜底
#
# 失败硬门禁：覆盖率 < 80% 直接挂掉，防止后续改动悄悄把覆盖打下去。

name: tests (python)

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/services/**"
      - "tests/**"
      - ".github/workflows/test-python.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/services/**"
      - "tests/**"
      - ".github/workflows/test-python.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: [self-hosted, ai-design-runner]   # 2026-05-15 改 self-hosted 绕开 GitHub Actions ubuntu-latest 配额耗尽问题；跑 pytest 几秒，跟 analyze 共享一台 runner 不冲突
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # 不用 actions/setup-python@v5：self-hosted runner pod 没 root、装不进 /opt/hostedtoolcache。
      # 镜像 ghcr.io/opensourceways-test/om-datacenter:latest 自带 python3 + pip3，--user 安装就行。
      - name: Install deps
        shell: bash
        run: |
          python3 --version
          python3 -m pip install --user --quiet --upgrade pip
          python3 -m pip install --user --quiet pyyaml pytest pytest-cov

      - name: Run tests with coverage gate ≥ 80%
        # tests/conftest.py 把 .github/scripts/ 加进 sys.path，所以 `--cov=services` 能用模块名定位
        shell: bash
        run: |
          python3 -m pytest tests/ -v \
            --cov=services \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80

      - name: Upload coverage XML (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
